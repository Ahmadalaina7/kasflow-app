# Plesk > Domein > Apache & nginx-instellingen
# 1. Haal het vinkje bij "Proxymodus" weg (nginx handelt verzoeken zelf af).
# 2. Plak dit blok bij "Aanvullende nginx-directives".
# 3. Vervang 8010 alleen als je in de systemd-service een andere poort koos.

client_max_body_size 12m;

location / {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
