# Proxyregels voor een Plesk-domein op LiteSpeed (in plaats van nginx).
#
# Waar plakken: Plesk > Websites & Domeinen > jouw domein > Apache &
# nginx-instellingen (of "Webserverinstellingen") > **Aanvullende directives voor
# HTTPS**. LiteSpeed leest dat veld als Apache-configuratie. Plak hetzelfde blok
# bij "Aanvullende directives voor HTTP" als je ook kale http wilt doorsturen —
# meestal doet Plesk dat al met een redirect.
#
# Voorwaarde: de app draait als service op 127.0.0.1:8010 (zie
# plesk/kasflow.service). Controleer eerst:
#   curl -sS http://127.0.0.1:8010/api/health
#
# Waarom geen Passenger: de Python-optie van Plesk gebruikt Phusion Passenger en
# is gedocumenteerd voor Apache en nginx. LiteSpeed ondersteunt Passenger alleen
# voor CloudLinux Selectors en niet de directive `PassengerEnabled`, dus
# plesk/htaccess werkt hier niet.

# 1. Alles naar de app, behalve wat LiteSpeed zelf moet blijven serveren.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^(.*)$ http://127.0.0.1:8010/$1 [P,L]

# 2. Alternatief als je LiteSpeed ProxyPass laat gebruiken (commentaar 1 uit en
#    gebruik dit blok):
# ProxyPreserveHost On
# ProxyPass / http://127.0.0.1:8010/
# ProxyPassReverse / http://127.0.0.1:8010/

# 3. Body-limiet voor bonnetjes: de app staat op 10 MB
#    (KASFLOW_MAX_UPLOAD_MB). Geeft een upload een 413 terwijl de app niets ziet,
#    zet dan in LiteSpeed (WebAdmin of vhost-config) MaxReqBodySize op 12M.
#    Bewust niet hier: een directive die LiteSpeed in dit veld niet kent, kan de
#    hele site laten stukgaan. Test na het plakken altijd /api/health.
